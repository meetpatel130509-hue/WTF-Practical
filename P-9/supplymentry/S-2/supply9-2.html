
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search Application</title>
    <link rel="stylesheet" href="supply9-2.css">
</head>
<body>

    <header>
        <h1>📚 Book Search Application</h1>
        <p>Discover and explore your favourite books</p>
    </header>

    <main class="container">

        <section class="search-section">
            <h2>Search Books</h2>

            <form id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Enter book title, author or keyword..."
                    required
                >

                <select id="searchType">
                    <option value="all">All</option>
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                </select>

                <button type="submit">Search</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="results-section">
            <h2>Search Results</h2>

            <div id="bookContainer" class="book-container">
                <p class="info">Search for a book to see results.</p>
            </div>
        </section>

        <section id="detailsSection" class="details-section" hidden>
            <h2>Book Details</h2>
            <div id="bookDetails"></div>
        </section>

    </main>

    <footer>
        <p>© 2026 Book Search Application</p>
        <p>Powered by Google Books API</p>
    </footer>

    <script src="supply9-2.js"></script>
</body>
</html>
