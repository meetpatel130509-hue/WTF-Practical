
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="supply8-2.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Employee Management System</h1>
            <p>Manage employee information using database connectivity</p>
        </header>

        <section class="form-section">
            <h2 id="formTitle">Add New Employee</h2>

            <form id="employeeForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="employeeId">Employee ID</label>
                        <input type="text" id="employeeId"
                               placeholder="Example: EMP101" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Employee Name</label>
                        <input type="text" id="name"
                               placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email"
                               placeholder="Enter email" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile"
                               placeholder="10-digit mobile number"
                               maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="IT">Information Technology</option>
                            <option value="HR">Human Resources</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="salary">Monthly Salary (₹)</label>
                        <input type="number" id="salary"
                               placeholder="Enter salary"
                               min="1" step="0.01" required>
                    </div>

                </div>

                <button type="submit" id="submitBtn">
                    Add Employee
                </button>

                <button type="reset" class="reset-btn">
                    Clear Form
                </button>

                <p id="message" role="status"></p>

            </form>
        </section>

        <section class="records-section">

            <div class="records-header">
                <h2>Employee Records</h2>

                <input type="text" id="searchInput"
                       placeholder="Search employee...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Employee ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTable"></tbody>
                </table>
            </div>

            <p id="emptyMessage">No employee records available.</p>

            <h3 id="totalEmployees">Total Employees: 0</h3>

        </section>

    </div>

    <script src="supply8-2.js"></script>
</body>
</html>
