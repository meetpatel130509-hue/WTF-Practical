
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
    <link rel="stylesheet" href="supply8-1.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Management System</h1>
            <p>Manage student records easily</p>
        </header>

        <!-- Student Form -->
        <section class="form-section">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="enrollment">Enrollment Number</label>
                        <input type="text" id="enrollment"
                               placeholder="Example: CE123"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="name">Student Name</label>
                        <input type="text" id="name"
                               placeholder="Enter student name"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email"
                               placeholder="Enter email"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile"
                               placeholder="10-digit mobile number"
                               maxlength="10"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch</label>
                        <select id="branch" required>
                            <option value="">Select Branch</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <select id="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="percentage">Percentage</label>
                        <input type="number" id="percentage"
                               placeholder="Enter percentage"
                               min="0" max="100" step="0.01"
                               required>
                    </div>

                </div>

                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button type="reset" class="reset-btn">
                    Clear Form
                </button>

                <p id="message"></p>

            </form>
        </section>

        <!-- Student Records -->
        <section class="records-section">

            <div class="records-header">
                <h2>Student Records</h2>

                <input type="text" id="searchInput"
                       placeholder="Search by name or enrollment number...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Enrollment</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Branch</th>
                            <th>Semester</th>
                            <th>Percentage</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No student records available.</p>

            <h3 id="totalStudents">Total Students: 0</h3>

        </section>

    </div>

    <script src="supply8-1.js"></script>
</body>
</html>
