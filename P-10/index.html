
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSecure Employee Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>FinSecure Solutions</h1>
    <p>Secure Employee Management Portal</p>
</header>

<div class="container">

    <section class="card">
        <h2>Employee Registration</h2>

        <form id="registerForm">
            <input type="text" id="name"
                   placeholder="Employee Name" required>

            <input type="email" id="email"
                   placeholder="Email Address" required>

            <input type="password" id="password"
                   placeholder="Create Password" required>

            <input type="password" id="confirmPassword"
                   placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>

        <p id="registerMessage"></p>
    </section>

    <section class="card">
        <h2>Employee Login</h2>

        <form id="loginForm">
            <input type="email" id="loginEmail"
                   placeholder="Email Address" required>

            <input type="password" id="loginPassword"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p id="loginMessage"></p>
    </section>

    <section class="card">
        <h2>XSS Security Demonstration</h2>

        <p>Enter text to test secure output encoding.</p>

        <input type="text" id="userInput"
               placeholder="Enter sample text">

        <button id="testButton">Test Input</button>

        <h3>Secure Output:</h3>
        <div id="output"></div>

        <h3>Unsafe Output (Text Only):</h3>
        <div id="unsafeOutput"></div>
    </section>

</div>

<footer>
    <p>© 2026 FinSecure Solutions Pvt. Ltd.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
