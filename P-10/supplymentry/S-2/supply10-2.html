
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration Form</title>
    <link rel="stylesheet" href="supply9-2.css">
</head>
<body>

    <div class="container">
        <h1>Secure Registration</h1>
        <p>Create your account safely</p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="password"
                       placeholder="Create password" required>
                <button type="button" id="showPassword">Show</button>
            </div>

            <div class="requirements">
                <p>Password must contain:</p>
                <ul>
                    <li>At least 12 characters</li>
                    <li>One uppercase letter</li>
                    <li>One lowercase letter</li>
                    <li>One number</li>
                    <li>One special character</li>
                </ul>
            </div>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm password" required>

            <button type="submit" id="submitBtn">
                Register
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>
    </div>

    <script src="supply9-2.js"></script>
</body>
</html>
